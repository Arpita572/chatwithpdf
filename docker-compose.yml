services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatwithpdf-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatwithpdf

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwithpdf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: